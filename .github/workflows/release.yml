name: Release PowerPresenter

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release macOS App
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app || true
          xcodebuild -version

      - name: Build PowerPresenter App
        run: |
          chmod +x ./scripts/build_app.sh
          ./scripts/build_app.sh

      - name: Create Release Archive (ZIP)
        run: |
          ditto -c -k --sequesterRsrc --keepParent PowerPresenter.app PowerPresenter.zip
          ls -lh PowerPresenter.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: PowerPresenter.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
